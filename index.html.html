<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주변 맛집 찾기</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2937; --sub: #6b7280;
    --primary: #e8590c; --primary-soft: #fff0e6; --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 14px 16px 10px; background: var(--card); border-bottom: 1px solid var(--border); }
  h1 { margin: 0 0 10px; font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .label { font-size: 13px; color: var(--sub); min-width: 36px; }
  .chip { border: 1px solid var(--border); background: var(--card); color: var(--text);
          padding: 10px 16px; border-radius: 999px; font-size: 15px; cursor: pointer; }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .locbtn { margin-left: auto; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--card); font-size: 14px; cursor: pointer; }
  #status { font-size: 13px; color: var(--sub); padding: 8px 16px; background: var(--primary-soft); }
  #status.error { background: #fee2e2; color: #991b1b; }
  main { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 520px; }
  #map { flex: 0 0 42%; min-height: 240px; background: #dfe3e8; }
  #list { flex: 1; overflow-y: auto; padding: 10px 12px 24px; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .item:active, .item.selected { border-color: var(--primary); background: var(--primary-soft); }
  .name { font-weight: 700; font-size: 16px; }
  .meta { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .dist { color: var(--primary); font-weight: 600; }
  .links { margin-top: 6px; font-size: 13px; }
  .links a { color: var(--primary); text-decoration: none; margin-right: 12px; }
  #more { display: none; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
          background: var(--card); font-size: 15px; cursor: pointer; }
  .empty { text-align: center; color: var(--sub); padding: 30px 0; }
  @media (min-width: 900px) {
    main { flex-direction: row; height: calc(100vh - 130px); }
    #map { flex: 1; }
    #list { flex: 0 0 380px; }
  }
</style>
</head>
<body>

<header>
  <h1>🍽️ 주변 맛집 찾기</h1>
  <div class="row">
    <span class="label">반경</span>
    <div id="radiusChips" class="row" style="margin:0"></div>
    <button class="locbtn" id="relocate">📍 내 위치 다시 찾기</button>
  </div>
  <div class="row" style="margin-bottom:0">
    <span class="label">분류</span>
    <div id="catChips" class="row" style="margin:0"></div>
  </div>
</header>

<div id="status">준비 중...</div>

<main>
  <div id="map"></div>
  <div id="list"></div>
</main>

<script>
/* ============================================================
   ★ 여기에 본인의 카카오 JavaScript 키를 넣으세요 ★
   (카카오 개발자 > 내 애플리케이션 > 앱 키 > JavaScript 키)
   그리고 같은 앱의 [플랫폼 > Web]에 이 페이지가 열리는 주소를 등록해야 합니다.
   ============================================================ */
const JS_KEY = '6dee6d2b13d1178a69dc2e8a776da391';

// 위치 권한을 거부하거나 실패했을 때 사용할 기본 위치 (서울교육대학교 부근)
const FALLBACK = { lat: 37.4902, lng: 127.0146, label: '서울교대 부근(기본 위치)' };

const RADII = [500, 1000, 2000];
const CATEGORIES = [
  { name: '전체', type: 'category', code: 'FD6' },
  { name: '한식', type: 'keyword', q: '한식' },
  { name: '중식', type: 'keyword', q: '중식' },
  { name: '일식', type: 'keyword', q: '일식' },
  { name: '카페', type: 'category', code: 'CE7' },
];

let map, ps, myPos = null, myMarker = null, infowindow;
let markers = [];
let state = { radius: 1000, cat: 0 };

const $status = document.getElementById('status');
const $list = document.getElementById('list');

function setStatus(msg, isError) {
  $status.textContent = msg;
  $status.className = isError ? 'error' : '';
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 칩 UI ---------- */
function buildChips() {
  const rc = document.getElementById('radiusChips');
  RADII.forEach(r => {
    const b = document.createElement('button');
    b.className = 'chip' + (r === state.radius ? ' active' : '');
    b.textContent = r >= 1000 ? (r / 1000) + 'km' : r + 'm';
    b.onclick = () => { state.radius = r; refreshChips(); search(); };
    b.dataset.r = r;
    rc.appendChild(b);
  });
  const cc = document.getElementById('catChips');
  CATEGORIES.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === state.cat ? ' active' : '');
    b.textContent = c.name;
    b.onclick = () => { state.cat = i; refreshChips(); search(); };
    b.dataset.i = i;
    cc.appendChild(b);
  });
}
function refreshChips() {
  document.querySelectorAll('#radiusChips .chip').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.r) === state.radius));
  document.querySelectorAll('#catChips .chip').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.i) === state.cat));
}

/* ---------- 위치 ---------- */
function locate() {
  setStatus('현재 위치를 확인하는 중...');
  if (!navigator.geolocation) {
    useFallback('이 브라우저는 위치 정보를 지원하지 않아요.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      setPosition(pos.coords.latitude, pos.coords.longitude);
      setStatus('현재 위치 기준으로 검색합니다.');
      search();
    },
    () => useFallback('위치 권한이 없어 기본 위치로 검색합니다.'),
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
  );
}
function useFallback(reason) {
  setPosition(FALLBACK.lat, FALLBACK.lng);
  setStatus(reason + ' (' + FALLBACK.label + ')');
  search();
}
function setPosition(lat, lng) {
  myPos = new kakao.maps.LatLng(lat, lng);
  map.setCenter(myPos);
  if (myMarker) myMarker.setMap(null);
  myMarker = new kakao.maps.Marker({ position: myPos, map });
  myMarker.setZIndex(10);
}

/* ---------- 검색 ---------- */
function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
  if (infowindow) infowindow.close();
}

function search() {
  if (!myPos) return;
  clearMarkers();
  $list.innerHTML = '<div class="empty">검색 중...</div>';
  const cat = CATEGORIES[state.cat];
  const opts = {
    location: myPos,
    radius: state.radius,
    sort: kakao.maps.services.SortBy.DISTANCE,
  };
  if (cat.type === 'category') {
    ps.categorySearch(cat.code, handleResult, opts);
  } else {
    opts.category_group_code = 'FD6';
    ps.keywordSearch(cat.q, handleResult, opts);
  }
}

function handleResult(data, status, pagination) {
  const first = pagination ? pagination.current === 1 : true;
  if (first) $list.innerHTML = '';

  if (status === kakao.maps.services.Status.ZERO_RESULT) {
    $list.innerHTML = '<div class="empty">이 반경에는 검색 결과가 없어요.<br>반경을 넓혀 보세요.</div>';
    return;
  }
  if (status !== kakao.maps.services.Status.OK) {
    $list.innerHTML = '<div class="empty">검색 중 오류가 발생했어요.</div>';
    return;
  }

  const bounds = new kakao.maps.LatLngBounds();
  bounds.extend(myPos);
  markers.forEach(m => bounds.extend(m.getPosition()));

  data.forEach(place => {
    const pos = new kakao.maps.LatLng(place.y, place.x);
    const marker = new kakao.maps.Marker({ position: pos, map });
    markers.push(marker);
    bounds.extend(pos);

    const el = document.createElement('div');
    el.className = 'item';
    const shortCat = (place.category_name || '').split(' > ').slice(-1)[0];
    el.innerHTML =
      '<div class="name">' + esc(place.place_name) + '</div>' +
      '<div class="meta"><span class="dist">' + esc(place.distance) + 'm</span> · ' + esc(shortCat) + '</div>' +
      '<div class="meta">' + esc(place.road_address_name || place.address_name) + '</div>' +
      (place.phone ? '<div class="meta">☎ ' + esc(place.phone) + '</div>' : '') +
      '<div class="links"><a href="' + esc(place.place_url) + '" target="_blank" rel="noopener">카카오맵에서 보기</a></div>';

    const select = () => {
      document.querySelectorAll('.item.selected').forEach(n => n.classList.remove('selected'));
      el.classList.add('selected');
      if (infowindow) infowindow.close();
      infowindow = new kakao.maps.InfoWindow({
        content: '<div style="padding:6px 10px;font-size:13px;white-space:nowrap;">' + esc(place.place_name) + '</div>'
      });
      infowindow.open(map, marker);
      map.panTo(pos);
    };
    el.addEventListener('click', e => { if (e.target.tagName !== 'A') select(); });
    kakao.maps.event.addListener(marker, 'click', () => {
      select();
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    $list.appendChild(el);
  });

  // 더보기 버튼 (한 번에 15개씩)
  const oldBtn = document.getElementById('more');
  if (oldBtn) oldBtn.remove();
  if (pagination && pagination.hasNextPage) {
    const btn = document.createElement('button');
    btn.id = 'more';
    btn.style.display = 'block';
    btn.textContent = '더보기';
    btn.onclick = () => { btn.remove(); pagination.nextPage(); };
    $list.appendChild(btn);
  }

  if (first) map.setBounds(bounds);
}

/* ---------- 초기화 ---------- */
function init() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(FALLBACK.lat, FALLBACK.lng),
    level: 4,
  });
  ps = new kakao.maps.services.Places();
  buildChips();
  document.getElementById('relocate').onclick = locate;
  locate();
}

(function loadSdk() {
  if (!JS_KEY || JS_KEY.startsWith('YOUR_')) {
    setStatus('코드 상단의 JS_KEY에 카카오 JavaScript 키를 입력해 주세요.', true);
    buildChips();
    return;
  }
  const s = document.createElement('script');
  s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(JS_KEY) +
          '&libraries=services&autoload=false';
  s.onload = () => kakao.maps.load(init);
  s.onerror = () => setStatus(
    '카카오 지도를 불러오지 못했어요. 키가 맞는지, 이 주소가 카카오 개발자 설정의 Web 플랫폼에 등록돼 있는지 확인해 주세요.', true);
  document.head.appendChild(s);
})();
</script>
</body>
</html>
